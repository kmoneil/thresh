name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to a pull request supersedes its older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# setup-zig is given no version: it installs build.zig.zon's
# minimum_zig_version, so the pin lives in one place.
jobs:
  check:
    name: format, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: zig fmt
        run: zig build fmt-check
      # zigvet is a build.zig.zon dependency, pinned by hash and built from
      # source, so a new zigvet release cannot fail an unchanged commit.
      - name: zigvet
        run: zig build vet
      # The generator must still write exactly what test/gen/MANIFEST says.
      - name: fixture corpus
        run: zig build corpus

  # The Arrow writer read back by pyarrow and by DuckDB (its community
  # arrow extension), value for value against the CSV output.
  arrow:
    name: arrow (pyarrow, DuckDB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: pyarrow and duckdb
        run: python3 -m pip install --user pyarrow duckdb pytz
      - name: zig build arrow-check
        run: zig build arrow-check

  # No benchmark stage more than 10% slower than on the base branch. Both
  # are built and run, in turns, on this runner: a hosted runner is not a
  # fixed machine, so a stored baseline would measure the runner.
  bench:
    name: benchmark gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: tools/bench_gate.sh
        run: tools/bench_gate.sh "origin/${{ github.base_ref }}"

  # ReleaseSafe as well as Debug: a safety check the optimizer can see
  # past, or a value read before it is set, can pass in one and not the
  # other (an allocation failing inside a union literal did, once).
  # Every platform a release ships for that a hosted runner has: Linux on
  # x86-64 and arm64, macOS (arm64), Windows. A runner with no python3
  # skips the corpus, examples and NOTICE checks (-Dcorpus=false).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.optimize }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: zig build test
        shell: bash
        run: |
          extra=""
          command -v python3 >/dev/null || extra="-Dcorpus=false"
          zig build test -Doptimize=${{ matrix.optimize }} $extra --summary all

  # The release build for every target, glibc and musl, x86-64 and arm64,
  # cross-compiled from one runner, so a target no runner tests still builds.
  cross:
    name: release builds (every target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: zig build --release, each target
        run: |
          for t in x86_64-linux-gnu aarch64-linux-gnu x86_64-linux-musl aarch64-linux-musl \
                   x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            echo "== $t"
            zig build --release -Dtarget=$t -p "out/$t"
          done
