# threshio, the Python package over libthresh. One Linux runner builds
# every platform's wheel (tools/python_wheels.py, Zig cross-compiling);
# then each platform installs the wheel pip picks for it, with no Zig and
# no checkout of python/src, and runs the package's tests against it: the
# calls, the Arrow streams through the C stream interface, every block of
# python/README.md and every script in examples/python, each compared
# with its output. Where pyarrow, polars and DuckDB have wheels, they are
# installed and the tests run again with them.
name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wheels:
    name: wheels (every platform)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: tools/python_wheels.py
        run: python3 -I tools/python_wheels.py
      - name: twine check
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q twine
          "$RUNNER_TEMP/venv/bin/twine" check --strict zig-out/wheels/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: zig-out/wheels/*.whl
          retention-days: 7
          if-no-files-found: error

  # The oldest Python the package supports on one runner, a current one on
  # the others. Linux is 24.04, whose setup-python still has 3.9.
  test:
    name: test (${{ matrix.name }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86-64 glibc, os: ubuntu-24.04, python: "3.9" }
          - { name: linux arm64 glibc, os: ubuntu-24.04-arm, python: "3.13" }
          - { name: macos arm64, os: macos-latest, python: "3.13" }
          - { name: macos x86-64, os: macos-15-intel, python: "3.13" }
          - { name: windows x86-64, os: windows-latest, python: "3.13" }
          - { name: windows arm64, os: windows-11-arm, python: "3.13" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # pip picks the wheel, so a wrong platform tag fails here. The tests
      # run from outside the checkout, against what pip installed.
      - name: the wheel, then its tests
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          py="$RUNNER_TEMP/venv/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/venv/Scripts/python"
          echo "PY=$py" >> "$GITHUB_ENV"
          "$py" -m pip install -q --no-index --find-links wheels threshio
          tests="$PWD/python/tests"
          cd "$RUNNER_TEMP"
          "$py" -c "import threshio, sys; print(threshio.__version__, threshio.__file__, sys.version)"
          "$py" -m unittest discover -v -s "$tests"
      - name: with pyarrow, polars and DuckDB, where they have wheels
        run: |
          if "$PY" -m pip install -q --only-binary :all: pyarrow polars duckdb; then
            tests="$PWD/python/tests"
            cd "$RUNNER_TEMP"
            "$PY" -m unittest discover -v -s "$tests"
          else
            echo "::notice::no wheels of pyarrow, polars or DuckDB here; their tests were skipped"
          fi

  # Alpine, for the musl wheels: the tests run in a python:alpine container
  # started by hand, since JavaScript actions do not run inside Alpine on
  # arm64. The image is pinned by its digest (the index of every arch), as
  # the actions are by their commits.
  musl:
    name: test (linux ${{ matrix.arch }} musl)
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: wheels
      - name: the wheel, then its tests, on Alpine
        run: |
          docker run --rm -v "$PWD:/w:ro" python:3.13-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8 sh -euc '
            python -m venv /venv
            /venv/bin/pip install -q --no-index --find-links /w/wheels threshio
            cd /tmp
            /venv/bin/python -c "import threshio, sys; print(threshio.__version__, threshio.__file__, sys.version)"
            /venv/bin/python -m unittest discover -v -s /w/python/tests
          '
